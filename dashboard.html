<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manager Oversight | TaskFlow Analytics</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        .bento-card {
            background: rgba(255, 255, 255, 1);
            border: 1px solid #f1f5f9;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.02), 0 2px 4px -1px rgba(0, 0, 0, 0.01);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .bento-card:hover {
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.05), 0 10px 10px -5px rgba(0, 0, 0, 0.02);
            transform: translateY(-2px);
        }

        .mesh-gradient {
            background-color: #f8fafc;
            background-image:
                radial-gradient(at 0% 0%, rgba(99, 102, 241, 0.05) 0px, transparent 50%),
                radial-gradient(at 100% 0%, rgba(16, 185, 129, 0.05) 0px, transparent 50%);
        }

        #app-loader {
            position: fixed;
            inset: 0;
            background: white;
            z-index: 50;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: opacity 0.5s ease;
        }

        .error-toast {
            position: fixed;
            bottom: 2rem;
            right: 2rem;
            background: #ef4444;
            color: white;
            padding: 1rem 2rem;
            border-radius: 1rem;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
            z-index: 100;
            display: none;
        }
    </style>
</head>

<body class="mesh-gradient min-h-screen text-slate-800 antialiased">

    <div id="error-toast" class="error-toast font-bold">
        <span id="error-message">Connection Failed.</span>
    </div>

    <!-- Initial Loading Overlay -->
    <div id="app-loader">
        <div class="flex flex-col items-center gap-4">
            <div class="w-12 h-12 border-4 border-indigo-600 border-t-transparent rounded-full animate-spin"></div>
            <p class="text-sm font-bold text-slate-500">Connecting to Laravel API...</p>
        </div>
    </div>

    <div class="max-w-[1600px] mx-auto p-4 md:p-10">

        <!-- Header -->
        <header class="flex flex-col xl:flex-row justify-between items-start xl:items-end mb-12 gap-8">
            <div class="space-y-2">
                <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-blue-50 border border-blue-100 mb-2">
                    <span id="status-indicator" class="w-2 h-2 rounded-full bg-yellow-500"></span>
                    <span id="status-text" class="text-[10px] font-bold text-blue-600 uppercase tracking-widest">Checking API...</span>
                </div>
                <h1 class="text-4xl font-extrabold text-slate-900 tracking-tight">Executive Summary</h1>
                <p class="text-slate-500 font-medium text-lg">PostgreSQL: <span class="text-slate-800 font-bold">axiom_scrumban</span></p>
            </div>

            <div class="flex flex-wrap items-center gap-4 bg-white/70 backdrop-blur-xl p-3 rounded-[2rem] border border-white shadow-sm w-full xl:w-auto">
                <button id="refreshBtn" class="bg-blue-600 text-white px-6 py-3 rounded-xl text-sm font-bold hover:bg-blue-700 active:scale-95 transition-all flex items-center gap-2">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
                    </svg>
                    <span>Fetch from Localhost</span>
                </button>
            </div>
        </header>

        <div id="dashboardContent" class="grid grid-cols-12 gap-6 lg:gap-8">

            <!-- Utilization Metric -->
            <div class="col-span-12 md:col-span-4 lg:col-span-3 bento-card p-6 rounded-[2.5rem] bg-slate-900 text-white flex flex-col justify-between overflow-hidden relative">
                <div>
                    <p class="text-slate-400 font-bold text-xs uppercase tracking-widest mb-1">Avg. Utilization</p>
                    <h2 class="text-5xl font-black"><span id="statCapacity">--</span><span class="text-blue-400">%</span></h2>
                </div>
                <div class="mt-8">
                    <div class="w-full bg-slate-800 h-2 rounded-full overflow-hidden">
                        <div id="capacityBar" class="bg-blue-500 h-full w-0 transition-all duration-700"></div>
                    </div>
                </div>
            </div>

            <!-- Late Tasks -->
            <div class="col-span-12 md:col-span-4 lg:col-span-3 bento-card p-6 rounded-[2.5rem] flex flex-col justify-between">
                <div class="bg-rose-50 w-12 h-12 rounded-2xl flex items-center justify-center text-rose-500 mb-4">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" />
                    </svg>
                </div>
                <div>
                    <h3 class="text-slate-400 font-bold text-xs uppercase tracking-widest">Late Tasks</h3>
                    <p class="text-4xl font-black text-slate-900 mt-1" id="statLate">--</p>
                </div>
            </div>

            <!-- Main Charts Area -->
            <div class="col-span-12 lg:col-span-8 space-y-8">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
                    <div class="bento-card p-8 rounded-[3rem]">
                        <h3 class="text-xl font-bold text-slate-900 mb-4">Sprint Momentum</h3>
                        <div id="momentumChart" class="h-[280px]"></div>
                    </div>
                    <div class="bento-card p-8 rounded-[3rem]">
                        <h3 class="text-xl font-bold text-slate-900 mb-4">Priority Mix</h3>
                        <div id="priorityChart" class="h-[280px]"></div>
                    </div>
                </div>
            </div>

            <!-- User List -->
            <div class="col-span-12 lg:col-span-4 bento-card p-8 rounded-[3rem]">
                <h3 class="text-xl font-black text-slate-900 mb-8">Personnel (Postgres)</h3>
                <div id="employeeList" class="space-y-6 text-slate-400 text-sm italic">
                    Connect Laravel to see users...
                </div>
            </div>

        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/apexcharts"></script>
    <script>
        const AxiomDB = {
            apiUrl: 'http://localhost:8000/scrumban/dashboard-summary',

            async fetchSummary() {
                try {
                    const response = await fetch(this.apiUrl, {
                        method: 'GET',
                        headers: {
                            'Accept': 'application/json',
                            'Content-Type': 'application/json',
                            'X-Requested-With': 'XMLHttpRequest'
                        },
                        credentials: 'same-origin'
                    });

                    if (!response.ok) {
                        console.error(`HTTP Error ${response.status}`);
                        return null;
                    }

                    const data = await response.json();

                    if (!data.success) {
                        console.error("API Error:", data.error);
                        return null;
                    }

                    return data;
                } catch (error) {
                    console.error("Connection Error:", error.message);
                    return null;
                }
            }
        };

        let charts = {
            momentum: null,
            priority: null
        };

        function updateStatus(connected) {
            const indicator = document.getElementById('status-indicator');
            const text = document.getElementById('status-text');
            if (connected) {
                indicator.className = "w-2 h-2 rounded-full bg-green-500";
                text.innerText = "Connected to Localhost";
            } else {
                indicator.className = "w-2 h-2 rounded-full bg-red-500";
                text.innerText = "API Offline (Check Laravel)";
            }
        }

        function initCharts() {
            const common = {
                chart: {
                    toolbar: {
                        show: false
                    },
                    fontFamily: 'inherit'
                }
            };

            charts.momentum = new ApexCharts(document.querySelector("#momentumChart"), {
                ...common,
                series: [{
                    name: 'Tasks',
                    data: [0, 0, 0, 0, 0, 0]
                }],
                chart: {
                    ...common.chart,
                    type: 'area',
                    height: 280
                },
                colors: ['#2563eb'],
                stroke: {
                    curve: 'smooth'
                },
                xaxis: {
                    categories: ['S1', 'S2', 'S3', 'S4', 'S5', 'S6']
                }
            });

            charts.priority = new ApexCharts(document.querySelector("#priorityChart"), {
                ...common,
                series: [0, 0, 0],
                chart: {
                    ...common.chart,
                    type: 'donut',
                    height: 280
                },
                labels: ['High', 'Medium', 'Low'],
                colors: ['#ef4444', '#f59e0b', '#3b82f6']
            });

            charts.momentum.render();
            charts.priority.render();
        }

        async function syncWithPostgres() {
            const loader = document.getElementById('app-loader');
            loader.style.display = 'flex';
            loader.style.opacity = '1';

            const response = await AxiomDB.fetchSummary();

            if (response && response.success) {
                updateStatus(true);

                // Safely update statistics
                const stats = response.stats || {};
                document.getElementById('statCapacity').innerText = stats.utilization || 0;
                document.getElementById('statLate').innerText = stats.lateTasks || 0;
                document.getElementById('capacityBar').style.width = (stats.utilization || 0) + '%';

                // Update charts with proper data validation
                const momentum = Array.isArray(stats.momentum) ? stats.momentum : [0, 0, 0, 0, 0, 0];
                const priorityData = Array.isArray(stats.priorityData) ? stats.priorityData : [0, 0, 0];

                charts.momentum.updateSeries([{
                    data: momentum.slice(-6)
                }]);
                charts.priority.updateSeries(priorityData);

                // Render team data
                const team = Array.isArray(response.team) ? response.team : [];
                renderUsers(team);
            } else {
                updateStatus(false);
                document.getElementById('error-toast').style.display = 'block';

                // Set default values on error
                document.getElementById('statCapacity').innerText = '0';
                document.getElementById('statLate').innerText = '0';
                document.getElementById('capacityBar').style.width = '0%';
                document.getElementById('employeeList').innerHTML = '<p class="text-slate-500">Unable to connect to database</p>';
            }

            loader.style.opacity = '0';
            setTimeout(() => loader.style.display = 'none', 500);
        }

        function renderUsers(users) {
            const list = document.getElementById('employeeList');
            if (!users || users.length === 0) {
                list.innerHTML = '<p>No users found in database.</p>';
                return;
            }
            list.innerHTML = users.map(u => `
                <div class="flex items-center gap-4 p-4 rounded-2xl bg-white border border-slate-100">
                    <div class="w-10 h-10 rounded-xl bg-blue-50 flex items-center justify-center text-blue-600 font-bold">
                        ${u.name.charAt(0)}
                    </div>
                    <div class="flex-grow">
                        <div class="flex justify-between items-center mb-1">
                            <h4 class="font-bold text-sm text-slate-900">${u.name}</h4>
                            <span class="text-[10px] font-bold text-slate-400">${u.load}%</span>
                        </div>
                        <div class="w-full bg-slate-100 h-1.5 rounded-full overflow-hidden">
                            <div class="bg-blue-600 h-full" style="width: ${u.load}%"></div>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        document.getElementById('refreshBtn').addEventListener('click', syncWithPostgres);

        window.onload = () => {
            initCharts();
            syncWithPostgres();
        };
    </script>
</body>

</html>
